<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu — Não Logado (Estilizado)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root{
      --bg:#f6faf6;
      --panel:#ffffff;
      --accent:#2f8f4a;
      --muted:#6b6b6b;
      --shadow: 0 8px 30px rgba(12,40,18,0.12);
      --radius:12px;
      --gap:14px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .menu-box {
      position: absolute;
      top: 62px;
      left: 18px;
      width: 320px;
      max-width: calc(100vw - 40px);
      background: linear-gradient(180deg, rgba(255,255,255,0.95), var(--panel));
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: var(--gap);
      align-items: start;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      transform-origin: top left;
      transform: translateY(-8px) scale(0.98);
      opacity: 0;
      visibility: hidden;
      transition: transform .22s cubic-bezier(.2,.9,.3,1), opacity .18s ease, visibility .18s;
      z-index: 1200;
    }

    .menu-box.visible{
      transform: translateY(0) scale(1);
      opacity: 1;
      visibility: visible;
    }

    .menu-lateral{
      background: linear-gradient(180deg,var(--accent), #4aa56a);
      border-radius: 10px;
      padding: 10px;
      color: white;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.06);
    }

    .menu-conteudo{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .menu-conteudo h3{
      margin:0;
      font-size:16px;
      color:#102014;
    }

    .menu-conteudo p{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }

    .menu-list{
      margin-top:6px;
      padding-top:8px;
      border-top:1px solid rgba(16,32,20,0.04);
    }

    .menu-list ul{
      list-style:none;
      margin:0;
      padding:0;
      display:grid;
      gap:8px;
    }

    .menu-list a{
      display:flex;
      gap:10px;
      padding:10px;
      border-radius:8px;
      text-decoration:none;
      color:#16321b;
      align-items:center;
      font-size:14px;
      transition:background .14s, transform .12s;
      border:1px solid rgba(16,32,20,0.04);
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.02));
    }

    .menu-list a i{
      width:28px;
      text-align:center;
      color:var(--accent);
    }

    .menu-list a:hover{
      background:linear-gradient(90deg, rgba(47,143,74,0.06), rgba(47,143,74,0.03));
      transform:translateX(4px);
    }

    .menu-icon{
      /* pages normally already show a menu icon; keep this for fallback if included here */
      font-size: 22px;
      cursor: pointer;
      color:#16321b;
    }

    @media (max-width:520px){
      .menu-box{ left:12px; right:12px; width:auto; grid-template-columns:60px 1fr; padding:12px; }
      .menu-list a{ padding:8px; font-size:13px; }
    }
  </style>
</head>
<body>
  <!-- Estrutura do menu (será injetada nas páginas via fetch) -->
  <div id="menu-nao-logado" class="menu-box" aria-hidden="true">
    <div class="menu-lateral" aria-hidden="true">
      <i class="fa-solid fa-compass-drafting"></i>
    </div>

    <div class="menu-conteudo" role="navigation" aria-label="Menu do site">
      <div>
        <h3>Bem-vindo</h3>
        <p>Entre ou crie sua conta para aproveitar todos os recursos.</p>
      </div>

      <nav class="menu-list" aria-label="Ações">
        <ul>
          <li>
            <a href="../Paginas_principais/Cadastro.html" id="link-cadastro">
              <i class="fa-regular fa-user"></i>
              Fazer cadastro
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <script>
    (function(){
      const menu = document.getElementById('menu-nao-logado');
      const toggleBtn = document.querySelector('.menu-icon, .menu-toggle, [data-toggle-menu="true"]');

      function openMenu(){
        menu.classList.add('visible');
        menu.setAttribute('aria-hidden','false');
        document.addEventListener('keydown', onKey);
      }
      function closeMenu(){
        menu.classList.remove('visible');
        menu.setAttribute('aria-hidden','true');
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e){
        if(e.key === 'Escape') closeMenu();
      }

      if(toggleBtn){
        toggleBtn.addEventListener('click', (ev)=>{
          ev.stopPropagation();
          if(menu.classList.contains('visible')) closeMenu(); else openMenu();
        });
      } else {
        // se a página injetar este arquivo e não tiver ícone, nada falha.
      }

      // fechar ao clicar fora
      document.addEventListener('click', function(e){
        if(!menu.contains(e.target) && !e.target.closest('.menu-icon')) closeMenu();
      });

      // impedir fechamento quando clicar dentro do menu
      menu.addEventListener('click', e => e.stopPropagation());

      // quando usuário clicar no link de cadastro, fecha o menu (melhora UX)
      const linkCadastro = document.getElementById('link-cadastro');
      if(linkCadastro) linkCadastro.addEventListener('click', ()=> closeMenu());
    })();
  </script>
</body>
</html>
