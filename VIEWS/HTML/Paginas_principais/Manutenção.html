<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../CSS/Manutenção.css">
  <title>Página em Manutenção</title>
  
</body>
  <!-- Cabeçalho com menu, login e logo -->
  <header>
    <div class="wrapper">

      <!-- Top Header -->
      <div class="top-header">
        <div class="menu-icon">☰</div>
        <div class="user-header">
          <span>👤</span> Visitante
        </div>
      </div>
  
      <div id="menuContainer"></div>

      <!-- Logo -->
      <div class="header">
        <div class="header-img">
          <a href="../Paginas_principais/Entrada.html">
          <img src="https://i.ibb.co/Q7T008b1/image.png" alt="Logo" />
          </a>
        </div>
      </div>
  </header>

    <main class="manutencao-container">
        <div class="manutencao-conteudo">
            <h1>Estamos em Manutenção</h1>
            <p>Estamos trabalhando para melhorar sua experiência.</p>
            <p>Por favor, volte mais tarde.</p>
            <a href="../Paginas_principais/Entrada.html" class="botao-voltar">Voltar para a Página Inicial</a>
        </div>
    </main>



    <!-- Rodapé -->
  <footer class="footer">
    <div class="footer-top">
      <a href="../Paginas_principais/SobreNos.html">
        <img src="https://i.ibb.co/j9vGknyy/image.png" alt="image" border="0">
      </a>
    </div>
    <div class="footer-bottom">
      <div class="footer-left">
        <a href="mailto:bella.avventura@gmail.com">📧 bella.avventura@gmail.com</a>
      </div>
      <div class="footer-center">© 2025 Bella Avventura</div>
      <div class="footer-right">
        <a href="../Paginas_principais/Termos_Condicoes.html">Termos e condições</a>
      </div>
    </div>
  </footer>
    <script>
document.addEventListener('DOMContentLoaded', function () {
    // Verifica autenticação
    checkAuth();
});

function checkAuth() {
    const userData = JSON.parse(localStorage.getItem('currentUser'));

    if (userData) {
        document.querySelector('.user-header').innerHTML = `<span>👤</span> ${userData.firstName}`;
        loadMenu('../Paginas_principais/Menu_Logado.html');
    } else {
        loadMenu('../Paginas_principais/Menu_Nao_Logado.html');
    }
}

function loadMenu(menuFile) {
    fetch(menuFile)
        .then(res => res.text())
        .then(html => {
            // Use o mesmo ID que o Hoteis.html usa
            document.getElementById('menuContainer').innerHTML = html;
            setupMenu();
        })
        .catch(err => {
            console.error('Erro ao carregar menu:', err);
        });
}

function setupMenu() {
    const menuIcon = document.querySelector('.menu-icon');
    const menu = document.querySelector('.menu-box');

    if (menu && menuIcon) {
        menuIcon.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            menu.classList.toggle('visible');
        });
    }

    const logoutBtn = document.getElementById('logout-link');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function (e) {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            window.location.href = '../Paginas_principais/Entrada.html';
        });
    }
}
</script>

</html>
